name: Image

# Builds ghcr.io/copodservices/basin-core from this fork. Upstream publishes no
# images, and the Backblaze compatibility patch only exists here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build information
        id: build
        run: echo "tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/copodservices/basin-core:${{ steps.build.outputs.tag }}
            ghcr.io/copodservices/basin-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
